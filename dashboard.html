<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard · Hive & Tools</title>
<link rel="icon" href="images/item/Beequip.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B323E; --ink-900:#122530; --ink-950:#0E1D26; --panel:#223F4C; --panel-2:#2C4E5C;
  --vert:#8FE86B; --vert-2:#4CC773; --cream:#F3F4F1; --muted:#93A7B0; --bad:#F0736A; --warn:#F4C542;
  --line:rgba(143,232,107,.14); --line-soft:rgba(243,244,241,.08);
  --surface:linear-gradient(168deg,#254453 0%,#1D3746 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--ink-950);color:var(--cream);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;line-height:1.2}
a{color:var(--vert)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--cream)}
.cache{display:none !important}

/* ---------- écrans de connexion ---------- */
.porte{min-height:100vh;display:grid;place-items:center;padding:1.5rem;
  background:radial-gradient(900px 500px at 50% -10%,rgba(143,232,107,.10),transparent 65%),var(--ink-950)}
.porte-carte{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:2.2rem 1.8rem;text-align:center;box-shadow:0 26px 60px rgba(0,0,0,.5)}
.porte-carte img{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.porte-carte h1{font-size:1.6rem;margin:.8rem 0 .4rem}
.porte-carte p{color:var(--muted);font-size:.92rem;margin-bottom:1.4rem}
.btn-discord{display:inline-flex;align-items:center;gap:.6rem;background:#5865F2;color:#fff;border:0;border-radius:12px;padding:.8rem 1.3rem;font-weight:600}
.btn-discord:hover{background:#4752C4}
.btn-discord svg{width:22px;height:22px}
.porte-carte code{background:rgba(0,0,0,.3);padding:.15rem .4rem;border-radius:6px;font-size:.85rem}

/* ---------- structure ---------- */
.appli{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.cote{background:var(--ink-900);border-right:1px solid var(--line-soft);padding:1rem .8rem;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:.9rem}
.marque{display:flex;align-items:center;gap:.6rem;padding:.3rem .4rem}
.marque img{width:38px;height:38px;border-radius:50%;background:var(--panel)}
.marque b{font-family:'Fredoka',system-ui,sans-serif;font-size:1.05rem;display:block}
.statut{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}
.point{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
.point.on{background:var(--vert);box-shadow:0 0 8px var(--vert)}
.choix-serveur{width:100%;background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:.55rem .6rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-titre{font-size:.7rem;color:var(--muted);padding:.7rem .6rem .3rem;letter-spacing:.3px}
.nav button{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;background:none;border:0;color:var(--cream);padding:.52rem .65rem;border-radius:9px;font-size:.92rem;opacity:.82}
.nav button:hover{background:rgba(255,255,255,.04);opacity:1}
.nav button.actif{background:rgba(143,232,107,.12);color:var(--vert);opacity:1;font-weight:600}
.nav .ico{width:20px;text-align:center}
.nav .etat{margin-left:auto;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.15)}
.nav .etat.on{background:var(--vert)}
.moi{margin-top:auto;display:flex;align-items:center;gap:.55rem;padding:.6rem .4rem;border-top:1px solid var(--line-soft)}
.moi img{width:30px;height:30px;border-radius:50%}
.moi span{font-size:.85rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.moi button{background:none;border:1px solid var(--line-soft);color:var(--muted);border-radius:8px;padding:.25rem .5rem;font-size:.75rem}
.principal{padding:1.6rem clamp(1rem,3vw,2.4rem) 7rem;max-width:1050px;width:100%}
.entete{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.4rem}
.entete h2{font-size:1.65rem}
.entete p{color:var(--muted);font-size:.92rem;margin-top:.2rem;max-width:62ch}
.entete .droite{margin-left:auto;display:flex;align-items:center;gap:.6rem}

/* ---------- cartes et champs ---------- */
.carte{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:1.15rem 1.25rem;margin-bottom:1rem}
.carte h3{font-size:1.08rem;margin-bottom:.15rem}
.carte .sous{color:var(--muted);font-size:.85rem;margin-bottom:.9rem}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.9rem 1rem}
.champ{display:flex;flex-direction:column;gap:.35rem}
.champ label{font-size:.82rem;color:var(--muted);font-weight:500}
.champ .aide{font-size:.75rem;color:var(--muted);opacity:.85}
.saisie,select.saisie,textarea.saisie{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line-soft);border-radius:10px;padding:.55rem .7rem;outline:none;transition:border-color .15s}
.saisie:focus{border-color:var(--vert)}
textarea.saisie{min-height:84px;resize:vertical;line-height:1.45}
input[type=color].saisie{padding:.2rem;height:40px;cursor:pointer}
.ligne-bascule{display:flex;align-items:center;gap:.9rem;padding:.25rem 0}
.ligne-bascule .txt{flex:1}
.ligne-bascule .txt b{display:block;font-weight:600;font-size:.95rem}
.ligne-bascule .txt span{font-size:.8rem;color:var(--muted)}
.bascule{position:relative;width:44px;height:24px;flex:0 0 auto}
.bascule input{opacity:0;width:0;height:0}
.bascule i{position:absolute;inset:0;background:rgba(255,255,255,.14);border-radius:24px;transition:.2s;cursor:pointer}
.bascule i::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.bascule input:checked + i{background:var(--vert-2)}
.bascule input:checked + i::after{transform:translateX(20px)}
.bascule input:focus-visible + i{outline:2px solid var(--vert);outline-offset:2px}
.module-tete{display:flex;align-items:center;gap:1rem;padding:1rem 1.25rem;border-radius:16px;margin-bottom:1rem;
  background:linear-gradient(120deg,rgba(143,232,107,.10),rgba(143,232,107,.02));border:1px solid var(--line)}
.module-tete .txt{flex:1}
.module-tete b{font-family:'Fredoka',system-ui,sans-serif;font-size:1.05rem}
.module-tete span{display:block;font-size:.82rem;color:var(--muted)}
.puces{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.puce{display:inline-flex;align-items:center;gap:.35rem;background:rgba(0,0,0,.28);border:1px solid var(--line-soft);border-radius:20px;padding:.22rem .35rem .22rem .6rem;font-size:.82rem}
.puce .pastille{width:9px;height:9px;border-radius:50%}
.puce button{background:none;border:0;color:var(--muted);width:20px;height:20px;border-radius:50%;line-height:1}
.puce button:hover{background:rgba(240,115,106,.2);color:var(--bad)}
.puces select{background:transparent;border:1px dashed var(--line);border-radius:20px;padding:.22rem .6rem;font-size:.82rem;color:var(--muted);max-width:220px}
.variables{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.15rem}
.variables button{background:rgba(143,232,107,.08);border:1px solid var(--line);color:var(--vert);border-radius:6px;padding:.08rem .4rem;font-size:.74rem;font-family:ui-monospace,monospace}
.btn{display:inline-flex;align-items:center;gap:.45rem;border-radius:10px;padding:.55rem 1rem;border:1px solid var(--line-soft);background:var(--panel-2);color:var(--cream);font-weight:600;font-size:.88rem}
.btn:hover{border-color:var(--vert)}
.btn.prim{background:var(--vert);color:var(--ink-950);border-color:var(--vert)}
.btn.prim:hover{background:#a6f186}
.btn.dang{background:transparent;color:var(--bad);border-color:rgba(240,115,106,.35)}
.btn.petit{padding:.32rem .65rem;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:default}
.rangee-actions{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end;margin-top:.9rem}

/* aperçu façon Discord */
.apercu{background:#313338;border-radius:10px;padding:.9rem 1rem;display:flex;gap:.8rem;font-size:.92rem;color:#dbdee1}
.apercu .av{width:40px;height:40px;border-radius:50%;flex:0 0 auto;background:var(--panel)}
.apercu .nom{font-weight:600;color:#fff}
.apercu .nom small{background:#5865F2;color:#fff;font-size:.62rem;padding:.05rem .3rem;border-radius:4px;margin-left:.3rem;vertical-align:middle}
.apercu .emb{margin-top:.35rem;border-left:4px solid var(--vert);background:#2b2d31;border-radius:4px;padding:.6rem .8rem;display:flex;gap:.8rem;max-width:440px}
.apercu .emb .mini{width:56px;height:56px;border-radius:50%;background:var(--panel);flex:0 0 auto}
.apercu .mention{background:rgba(88,101,242,.3);color:#c9cdfb;border-radius:3px;padding:0 2px}

/* tableaux */
.tableau{width:100%;border-collapse:collapse;font-size:.87rem}
.tableau th{text-align:left;font-weight:600;color:var(--muted);font-size:.76rem;padding:.5rem .6rem;border-bottom:1px solid var(--line-soft)}
.tableau td{padding:.55rem .6rem;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tableau tr:last-child td{border-bottom:0}
.tableau .av{width:26px;height:26px;border-radius:50%;vertical-align:middle;margin-right:.45rem;background:var(--panel)}
.badge{display:inline-block;padding:.1rem .5rem;border-radius:20px;font-size:.72rem;font-weight:600;background:rgba(255,255,255,.08)}
.badge.warn{background:rgba(244,197,66,.15);color:var(--warn)} .badge.mute{background:rgba(240,138,75,.15);color:#F08A4B}
.badge.kick,.badge.ban{background:rgba(240,115,106,.16);color:var(--bad)} .badge.on{background:rgba(143,232,107,.15);color:var(--vert)}
.vide{color:var(--muted);text-align:center;padding:1.4rem;font-size:.9rem}
.defile{overflow-x:auto}

/* vue d'ensemble */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin-bottom:1rem}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:.9rem 1rem}
.stat span{font-size:.78rem;color:var(--muted)}
.stat b{display:block;font-family:'Fredoka',system-ui,sans-serif;font-size:1.6rem;margin-top:.1rem}
.modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.7rem}
.mod{display:flex;align-items:center;gap:.7rem;background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:.8rem .9rem;text-align:left;color:var(--cream)}
.mod:hover{border-color:var(--vert)}
.mod .ico{font-size:1.3rem}
.mod b{display:block;font-size:.92rem}
.mod small{color:var(--muted);font-size:.76rem}

/* listes éditables */
.liste-ed{display:flex;flex-direction:column;gap:.5rem}
.item-ed{display:grid;gap:.5rem;align-items:center;background:rgba(0,0,0,.18);border:1px solid var(--line-soft);border-radius:10px;padding:.5rem .6rem}
.panneau{border:1px solid var(--line-soft);border-radius:14px;margin-bottom:.8rem;overflow:hidden}
.panneau-tete{display:flex;align-items:center;gap:.6rem;padding:.75rem .9rem;background:rgba(0,0,0,.18);cursor:pointer}
.panneau-tete b{flex:1}
.panneau-corps{padding:.9rem}

/* barre d'enregistrement */
.barre-sauver{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,160%);transition:transform .25s cubic-bezier(.2,.9,.3,1.2),opacity .2s,visibility .25s;
  background:#0B171E;border:1px solid var(--line);border-radius:14px;padding:.7rem .8rem .7rem 1.1rem;display:flex;align-items:center;gap:.8rem;box-shadow:0 18px 40px rgba(0,0,0,.55);z-index:20;width:min(620px,calc(100% - 2rem))}
.barre-sauver{visibility:hidden;opacity:0}
.barre-sauver.visible{transform:translate(-50%,0);visibility:visible;opacity:1}
.barre-sauver span{flex:1;font-size:.9rem}
.toasts{position:fixed;top:1rem;right:1rem;display:flex;flex-direction:column;gap:.5rem;z-index:30}
.toast{background:#0B171E;border:1px solid var(--line);border-left:4px solid var(--vert);border-radius:10px;padding:.65rem .9rem;font-size:.88rem;max-width:360px;box-shadow:0 10px 26px rgba(0,0,0,.45);animation:entre .25s ease}
.toast.err{border-left-color:var(--bad)}
@keyframes entre{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.chargement{color:var(--muted);padding:2rem;text-align:center}

@media (max-width:860px){
  .appli{grid-template-columns:1fr}
  .cote{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line-soft)}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:.3rem}
  .nav-titre{display:none}
  .nav button{white-space:nowrap;width:auto}
  .moi{margin-top:0}
  .entete{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<!-- ======== écran : connexion ======== -->
<div class="porte cache" id="ecran-connexion">
  <div class="porte-carte">
    <img src="images/item/Beequip.webp" alt="">
    <h1>Dashboard du bot</h1>
    <p>Réglages du bot Hive & Tools. Connecte-toi avec le compte Discord propriétaire du bot.</p>
    <button class="btn-discord" id="btn-connexion">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19.7 19.7 0 0 0 15.4 3l-.6 1.3a18.3 18.3 0 0 0-5.6 0L8.6 3a19.6 19.6 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a19.9 19.9 0 0 0 6 3l1.3-2.1c-.7-.3-1.4-.6-2-1l.5-.4a14.1 14.1 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.8 19.8 0 0 0 6-3c.5-5.2-.8-9.7-3.6-13.7ZM8.3 15.3c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm7.4 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>
      Se connecter avec Discord
    </button>
  </div>
</div>

<!-- ======== écran : accès refusé ======== -->
<div class="porte cache" id="ecran-refus">
  <div class="porte-carte">
    <img src="images/item/Beequip.webp" alt="">
    <h1>Accès réservé</h1>
    <p id="refus-texte">Ce dashboard est réservé au propriétaire du bot.</p>
    <button class="btn" id="btn-refus-sortir">Se déconnecter</button>
  </div>
</div>

<!-- ======== l'application ======== -->
<div class="appli cache" id="ecran-appli">
  <aside class="cote">
    <div class="marque">
      <img id="bot-avatar" src="images/item/Beequip.webp" alt="">
      <div><b id="bot-nom">Hive & Tools</b><span class="statut"><i class="point" id="bot-point"></i><span id="bot-statut">…</span></span></div>
    </div>
    <select class="choix-serveur" id="choix-serveur" aria-label="Serveur"></select>
    <nav class="nav" id="nav"></nav>
    <div class="moi"><img id="moi-avatar" alt=""><span id="moi-nom"></span><button id="btn-sortir">Quitter</button></div>
  </aside>
  <main class="principal" id="principal"></main>
</div>

<div class="barre-sauver" id="barre-sauver" role="status">
  <span>Tu as des modifications non enregistrées.</span>
  <button class="btn" id="btn-annuler">Annuler</button>
  <button class="btn prim" id="btn-sauver">Enregistrer</button>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="nuage-config.js"></script>
<script>
'use strict';
/* =====================================================================
   Dashboard du bot. Lit et écrit les tables bot_* de Supabase ; les règles
   de la base n'autorisent que les comptes Discord inscrits dans bot_admins.
   ?demo=1 affiche des données d'exemple sans connexion.
   ===================================================================== */
const DEMO = new URLSearchParams(location.search).has('demo');
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* mêmes valeurs par défaut que le bot (src/serveurs/reglages.js) */
const DEFAUT = {
  ia: { salons: {}, mention: true },
  bienvenue: { actif: false, salon: '', message: 'Bienvenue {membre} sur **{serveur}** ! Tu es notre {compte}ᵉ membre 🐝', embed: true, couleur: '#8FE86B', image: true,
    mp: false, messageMp: 'Bienvenue sur {serveur} ! Pense à lire le règlement.', depart: { actif: false, salon: '', message: '**{pseudo}** a quitté le serveur. À bientôt 👋' }, autoroles: [], autorolesBots: [] },
  niveaux: { actif: false, xpMin: 15, xpMax: 25, delai: 60, multiplicateur: 1, annonce: 'salon', salonAnnonce: '', message: '🎉 GG {membre}, tu passes **niveau {niveau}** !', recompenses: [], cumuler: true, salonsIgnores: [], rolesIgnores: [] },
  logs: { actif: false, salon: '', evenements: { messagesSupprimes: true, messagesModifies: true, arrivees: true, departs: true, sanctions: true, roles: true, pseudos: true, salons: false } },
  moderation: { actif: true, mpSanction: true, rolesModo: [], avertissements: { seuilMute: 3, dureeMute: 60, seuilKick: 5, seuilBan: 0 } },
  tickets: { actif: false, categorie: '', rolesStaff: [], salonTranscripts: '', maxParMembre: 1, titre: "🎫 Besoin d'aide ?", description: 'Clique sur le bouton pour ouvrir un ticket privé avec le staff.',
    bouton: 'Ouvrir un ticket', messageOuverture: 'Salut {membre} ! Explique ta demande, un membre du staff va te répondre.', couleur: '#8FE86B' },
  rolesBoutons: { panneaux: [] },
  giveaways: { couleur: '#F4C542', emoji: '🎉' },
  sondages: { couleur: '#5BA7E0' },
};
function fusion(b, a) {
  if (Array.isArray(b) || Array.isArray(a)) return a !== undefined ? a : b;
  if (b && typeof b === 'object' && a && typeof a === 'object') { const r = { ...b }; Object.keys(a).forEach(k => { r[k] = fusion(b[k], a[k]); }); return r; }
  return a !== undefined ? a : b;
}
const lirePath = (o, p) => p.split('.').reduce((x, k) => (x == null ? undefined : x[k]), o);
function ecrirePath(o, p, v) { const k = p.split('.'); let x = o; k.slice(0, -1).forEach((c, i) => { if (x[c] == null) x[c] = /^\d+$/.test(k[i + 1]) ? [] : {}; x = x[c]; }); x[k[k.length - 1]] = v; }
const clone = (o) => JSON.parse(JSON.stringify(o));

/* ---------- état ---------- */
const E = { sb: null, user: null, etat: null, serveurs: [], gid: null, cfgOrig: null, cfg: null, section: 'accueil', sale: false };
const serveur = () => E.serveurs.find(s => s.guild_id === E.gid) || { salons: [], roles: [] };

/* ---------- Supabase ---------- */
const BASE = {
  async lire(t, filtre = {}, opts = {}) {
    if (DEMO) return demo.lire(t, filtre);
    let q = E.sb.from(t).select('*');
    Object.entries(filtre).forEach(([k, v]) => { q = q.eq(k, v); });
    if (opts.ordre) q = q.order(opts.ordre, { ascending: !opts.desc });
    if (opts.limite) q = q.limit(opts.limite);
    const { data, error } = await q; if (error) throw error; return data || [];
  },
  async enregistrer(t, ligne) { if (DEMO) return demo.enregistrer(t, ligne); const { error } = await E.sb.from(t).upsert(ligne); if (error) throw error; },
  async modifier(t, filtre, v) { if (DEMO) return; let q = E.sb.from(t).update(v); Object.entries(filtre).forEach(([k, x]) => { q = q.eq(k, x); }); const { error } = await q; if (error) throw error; },
  async supprimer(t, filtre) { if (DEMO) return demo.supprimer(t, filtre); let q = E.sb.from(t).delete(); Object.entries(filtre).forEach(([k, x]) => { q = q.eq(k, x); }); const { error } = await q; if (error) throw error; },
  async ajouter(t, ligne) { if (DEMO) return { id: Date.now(), ...ligne }; const { data, error } = await E.sb.from(t).insert(ligne).select(); if (error) throw error; return data[0]; },
};

/* ---------- petites aides d'interface ---------- */
function toast(txt, err = false) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = txt;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 4200);
}
function montrer(id) { ['ecran-connexion', 'ecran-refus', 'ecran-appli'].forEach(x => $('#' + x).classList.toggle('cache', x !== id)); }
const salonsDe = (types = ['texte', 'annonces']) => serveur().salons.filter(s => types.includes(s.type));
const nomSalon = (id) => { const s = serveur().salons.find(x => x.id === id); return s ? (s.type === 'categorie' ? s.nom : '#' + s.nom) : (id ? 'salon supprimé' : ''); };
const roleDe = (id) => serveur().roles.find(r => r.id === id);

const C = {   // contrôles liés à la configuration (data-path)
  bascule(path, titre, txt = '') {
    return `<div class="ligne-bascule"><div class="txt"><b>${titre}</b>${txt ? `<span>${txt}</span>` : ''}</div>
      <label class="bascule"><input type="checkbox" data-path="${path}" ${lirePath(E.cfg, path) ? 'checked' : ''}><i></i></label></div>`;
  },
  texte(path, label, { aide = '', ph = '', multi = false, vars = null, max = 2000 } = {}) {
    const v = esc(lirePath(E.cfg, path) ?? '');
    const champ = multi ? `<textarea class="saisie" data-path="${path}" maxlength="${max}" placeholder="${esc(ph)}">${v}</textarea>` : `<input class="saisie" data-path="${path}" maxlength="${max}" value="${v}" placeholder="${esc(ph)}">`;
    const variables = vars ? `<div class="variables">${vars.map(x => `<button type="button" data-inserer="${path}" data-var="{${x}}">{${x}}</button>`).join('')}</div>` : '';
    return `<div class="champ"><label>${label}</label>${champ}${variables}${aide ? `<span class="aide">${aide}</span>` : ''}</div>`;
  },
  nombre(path, label, { min = 0, max = 100000, pas = 1, aide = '' } = {}) {
    return `<div class="champ"><label>${label}</label><input class="saisie" type="number" data-path="${path}" data-type="nombre" min="${min}" max="${max}" step="${pas}" value="${esc(lirePath(E.cfg, path))}">${aide ? `<span class="aide">${aide}</span>` : ''}</div>`;
  },
  couleur(path, label) { return `<div class="champ"><label>${label}</label><input class="saisie" type="color" data-path="${path}" value="${esc(lirePath(E.cfg, path) || '#8FE86B')}"></div>`; },
  choix(path, label, options, aide = '') {
    const v = lirePath(E.cfg, path);
    return `<div class="champ"><label>${label}</label><select class="saisie" data-path="${path}">${options.map(([val, t]) => `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>${aide ? `<span class="aide">${aide}</span>` : ''}</div>`;
  },
  salon(path, label, { types = ['texte', 'annonces'], vide = '— Aucun —', aide = '' } = {}) {
    return C.choix(path, label, [['', vide], ...salonsDe(types).map(s => [s.id, (s.type === 'categorie' ? '📁 ' : '# ') + s.nom])], aide);
  },
  salons(path, label, { types = ['texte', 'annonces', 'forum'], aide = '' } = {}) {
    const ids = lirePath(E.cfg, path) || [];
    return `<div class="champ"><label>${label}</label><div class="puces">${ids.map(id => `<span class="puce"># ${esc(nomSalon(id).replace(/^#/, ''))}<button type="button" data-retirer="${path}" data-val="${id}" aria-label="Retirer">✕</button></span>`).join('')}
      <select data-ajouter="${path}"><option value="">+ Ajouter</option>${salonsDe(types).filter(s => !ids.includes(s.id)).map(s => `<option value="${s.id}"># ${esc(s.nom)}</option>`).join('')}</select></div>${aide ? `<span class="aide">${aide}</span>` : ''}</div>`;
  },
  role(path, label, { vide = '— Aucun —' } = {}) {
    return C.choix(path, label, [['', vide], ...serveur().roles.filter(r => !r.gere).map(r => [r.id, '@' + r.nom])]);
  },
  roles(path, label, { aide = '', assignables = false } = {}) {
    const ids = lirePath(E.cfg, path) || [];
    const dispo = serveur().roles.filter(r => !r.gere && !ids.includes(r.id) && (!assignables || r.assignable));
    return `<div class="champ"><label>${label}</label><div class="puces">${ids.map(id => { const r = roleDe(id); return `<span class="puce"><i class="pastille" style="background:${r && r.couleur !== '#000000' ? r.couleur : '#99aab5'}"></i>${esc(r ? r.nom : 'rôle supprimé')}<button type="button" data-retirer="${path}" data-val="${id}" aria-label="Retirer">✕</button></span>`; }).join('')}
      <select data-ajouter="${path}"><option value="">+ Ajouter un rôle</option>${dispo.map(r => `<option value="${r.id}">@${esc(r.nom)}</option>`).join('')}</select></div>${aide ? `<span class="aide">${aide}</span>` : ''}</div>`;
  },
  tete(path, titre, txt) {
    return `<div class="module-tete"><div class="txt"><b>${titre}</b><span>${txt}</span></div>
      <label class="bascule"><input type="checkbox" data-path="${path}" ${lirePath(E.cfg, path) ? 'checked' : ''}><i></i></label></div>`;
  },
};

function dateCourte(d) { if (!d) return '—'; const x = new Date(d); return x.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' ' + x.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
const NOMS_SANCTION = { warn: 'Avertissement', mute: 'Muet', unmute: 'Fin de muet', kick: 'Expulsion', ban: 'Ban', unban: 'Déban', clear: 'Nettoyage' };

const xpPalier = (n) => 5 * n * n + 50 * n + 100;
function niveauDe(xp) { let n = 0, r = xp; while (r >= xpPalier(n)) { r -= xpPalier(n); n++; } return n; }
function tableNiveaux(l, actions) {

  E.section = section; rendreNav();

/* actions envoyées au bot (table bot_actions), avec attente du résultat */
async function demanderAuBot(type, donnees, attente = 'Demande envoyée au bot…') {
  if (DEMO) { toast('✅ (démo) ' + type); return; }
  if (E.sale) { toast('Enregistre d\'abord tes modifications.', true); return; }
  toast(attente);
  const a = await BASE.ajouter('bot_actions', { guild_id: E.gid, type, donnees });
  for (let k = 0; k < 20; k++) {
    await new Promise(r => setTimeout(r, 1500));
    const l = await BASE.lire('bot_actions', { id: a.id });
    if (l[0] && l[0].fait) { toast(l[0].resultat || '✅ Fait', String(l[0].resultat || '').startsWith('❌')); return l[0]; }
  }
  toast('Le bot n\'a pas répondu : est-il allumé ?', true);
}
function dureeMs(t) {
  const s = String(t || '').trim().toLowerCase(); if (!s) return null;
  if (/^\d+$/.test(s)) return +s * 60000;
  let total = 0, ok = false;
  s.replace(/(\d+(?:[.,]\d+)?)\s*(s|m|min|h|j|d|sem|w)/g, (_, n, u) => { ok = true; n = parseFloat(n.replace(',', '.')); total += n * ({ s: 1e3, m: 6e4, min: 6e4, h: 36e5, j: 864e5, d: 864e5, sem: 6048e5, w: 6048e5 })[u]; });
  return ok ? total : null;
}
async function agir(action, b) {
  const c = E.cfg;
  switch (action) {
    case 'ia-ajouter': { const id = $('#ia-ajout').value; if (!id) return; c.ia.salons = { ...c.ia.salons, [id]: { mode: 'questions' } }; break; }
    case 'ia-retirer': { const s = { ...c.ia.salons }; delete s[b.dataset.id]; c.ia.salons = s; break; }
    case 'rec-ajouter': c.niveaux.recompenses = [...(c.niveaux.recompenses || []), { niveau: 5, role: '' }]; break;
    case 'rec-retirer': c.niveaux.recompenses = c.niveaux.recompenses.filter((_, k) => k !== +b.dataset.k); break;
    case 'panneau-ajouter': c.rolesBoutons.panneaux = [...(c.rolesBoutons.panneaux || []), { id: 'p' + Date.now().toString(36), titre: 'Choisis tes rôles', description: '', salon: '', mode: 'multiple', couleur: '#8FE86B', roles: [] }]; break;
    case 'panneau-suppr': if (!confirm('Supprimer ce panneau ? (le message déjà publié sur Discord ne fonctionnera plus)')) return; c.rolesBoutons.panneaux = c.rolesBoutons.panneaux.filter((_, k) => k !== +b.dataset.k); break;
    case 'panneau-plier': { const p = c.rolesBoutons.panneaux[+b.dataset.k]; Object.defineProperty(p, '_plie', { value: !p._plie, enumerable: false, configurable: true, writable: true }); return afficher(); }
    case 'pr-ajouter': { const p = c.rolesBoutons.panneaux[+b.dataset.k]; if ((p.roles || []).length >= 25) return toast('25 rôles maximum par panneau.', true); p.roles = [...(p.roles || []), { role: '', label: '', emoji: '', style: 'gris' }]; break; }
    case 'pr-retirer': { const p = c.rolesBoutons.panneaux[+b.dataset.k]; p.roles = p.roles.filter((_, j) => j !== +b.dataset.j); break; }
    case 'panneau-publier': { const p = c.rolesBoutons.panneaux[+b.dataset.k]; if (!p.salon) return toast('Choisis d\'abord un salon pour ce panneau.', true); if (!(p.roles || []).some(r => r.role)) return toast('Ajoute au moins un rôle.', true); return demanderAuBot('publier_roles', { panneau: p.id }, 'Publication du panneau…').then(() => rechargerConfig()); }
    case 'publier-tickets': return demanderAuBot('publier_tickets', { salon: $('#tk-salon').value }, 'Publication du panneau de tickets…');
    case 'tester-bienvenue': if (!c.bienvenue.salon) return toast('Choisis d\'abord le salon de bienvenue.', true); return demanderAuBot('tester_bienvenue', {}, 'Envoi du message de test…');
    case 'annonce': {
      const message = $('#an-message').value.trim(); if (!message && !$('#an-titre').value.trim()) return toast('Écris un message.', true);
      return demanderAuBot('annonce', { salon: $('#an-salon').value, message, titre: $('#an-titre').value.trim(), image: $('#an-image').value.trim() || null, couleur: $('#an-couleur').value, embed: $('#an-embed').checked, mention: $('#an-mention').value || null }, 'Envoi de l\'annonce…');
    }
    case 'giveaway': {
      const lot = $('#gw-lot').value.trim(), ms = dureeMs($('#gw-duree').value);
      if (!lot) return toast('Indique le lot.', true); if (!ms) return toast('Durée invalide : ex. 2h ou 3j.', true);
      await demanderAuBot('giveaway', { salon: $('#gw-salon').value, lot, dureeMs: ms, gagnants: +$('#gw-gagnants').value || 1 }, 'Lancement du giveaway…'); return afficher();
    }
    case 'sondage': {
      const q = $('#sd-question').value.trim(), options = $('#sd-choix').value.split('\n').map(x => x.trim()).filter(Boolean);
      if (!q) return toast('Écris la question.', true); if (options.length < 2 || options.length > 10) return toast('Il faut entre 2 et 10 choix.', true);
      return demanderAuBot('sondage', { salon: $('#sd-salon').value, question: q, options, dureeMs: dureeMs($('#sd-duree').value) }, 'Publication du sondage…');
    }
    case 'sanction-suppr': if (!confirm('Supprimer cette sanction de l\'historique ?')) return; await BASE.supprimer('bot_sanctions', { id: b.dataset.id }); toast('Sanction supprimée.'); return afficher();
    case 'xp-maj': { const v = Math.max(0, +document.querySelector(`[data-xp="${b.dataset.id}"]`).value || 0); await BASE.modifier('bot_niveaux', { guild_id: E.gid, user_id: b.dataset.id }, { xp: v, niveau: niveauDe(v) }); toast('XP mis à jour (pris en compte par le bot sous 5 minutes).'); return afficher(); }
    default: return;
  }
  marquerSale(); afficher();
}

/* ---------- démarrage ---------- */
async function entrer(user) {
  E.user = user;
  const meta = user.user_metadata || {};
  $('#moi-nom').textContent = meta.full_name || meta.name || meta.user_name || 'Moi';
  if (meta.avatar_url) $('#moi-avatar').src = meta.avatar_url;
  if (!DEMO) {
    const { data: admin, error } = await E.sb.rpc('est_admin_bot');
    if (error || !admin) {
      const id = meta.provider_id || meta.sub || '?';
      $('#refus-texte').innerHTML = error && /est_admin_bot/.test(error.message)
        ? 'La base n\'est pas encore prête : exécute le fichier <code>supabase-bot.sql</code> dans Supabase (voir le README du bot).'
        : `Ce dashboard est réservé au propriétaire du bot.<br><br>Ton identifiant Discord : <code>${esc(id)}</code><br>Si c'est bien toi le propriétaire, démarre le bot une fois : il t'inscrit tout seul.`;
      return montrer('ecran-refus');
    }
  }
  montrer('ecran-appli');
  const [etat, serveurs] = await Promise.all([BASE.lire('bot_etat').catch(() => []), BASE.lire('bot_serveurs').catch(() => [])]);
  E.etat = etat[0] || null; E.serveurs = serveurs.sort((a, b) => (b.membres || 0) - (a.membres || 0)); majEtat();
  $('#choix-serveur').innerHTML = E.serveurs.map(s => `<option value="${s.guild_id}">${esc(s.nom)}</option>`).join('') || '<option>Aucun serveur</option>';
  let gid = null; try { gid = localStorage.getItem('dash-serveur'); } catch (e) { /* */ }
  if (!E.serveurs.some(s => s.guild_id === gid)) gid = E.serveurs[0] && E.serveurs[0].guild_id;
  if (gid) { $('#choix-serveur').value = gid; E.gid = gid; await rechargerConfig(); } else afficher();
  setInterval(async () => { const l = await BASE.lire('bot_etat').catch(() => null); if (l && l[0]) { E.etat = l[0]; majEtat(); } }, 30000);
}

async function demarrer() {
  if (DEMO) return entrer({ user_metadata: { full_name: 'FauFau (démo)', avatar_url: 'images/item/Beequip.webp' } });
  if (!window.supabase || !window.NUAGE_CONFIG) { $('#ecran-connexion .porte-carte p').textContent = 'Impossible de charger la connexion (nuage-config.js ou Supabase).'; return montrer('ecran-connexion'); }
  E.sb = supabase.createClient(NUAGE_CONFIG.url, NUAGE_CONFIG.cle);
  const { data } = await E.sb.auth.getSession();
  if (data.session) return entrer(data.session.user);
  montrer('ecran-connexion');
  E.sb.auth.onAuthStateChange((ev, s) => { if (s && ev === 'SIGNED_IN' && !E.user) entrer(s.user); });
}
